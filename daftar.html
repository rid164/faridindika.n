<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
    <title>List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        ul, ol {
            margin-left: 20px;
        }
        .notes {
            margin-top: 20px;
            font-style: italic;
            color: #555;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>The Ingredients:</h1>
    <ul>
        <li>100 g flour</li>
        <li>10 g sugar</li>
        <li>1 cup water</li>
        <li>2 eggs</li>
        <li>salt, pepper</li>
    </ul>

    <h1>The Procedure:</h1>
    <ol>
        <li>Mix dry ingredients thoroughly.</li>
        <li>Pour in wet ingredients.</li>
        <li>Mix for 10 minutes.</li>
        <li>Bake for one hour at 300 degrees.</li>
    </ol>

    <div class="notes">
        <strong>Notes:</strong> The recipe may be improved by adding raisins.
    </div>
</div>

</body>
</html>
